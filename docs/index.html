<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>serelllka</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #203d33; background: #f4f3ee; font: 18px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: auto; padding: 40px 24px; }
    header { display: flex; justify-content: space-between; border-bottom: 1px solid #bac2b7; padding-bottom: 20px; }
    section { padding: 70px 0; }
    label { display: block; margin-bottom: 12px; }
    input { width: 100%; padding: 18px; font: inherit; color: inherit; border: 1px solid #92a295; border-radius: 12px; background: white; }
    input:focus { outline: 3px solid #648c70; outline-offset: 3px; }
    h1 { min-height: 72px; margin: 12px 0; font-size: 48px; overflow-wrap: break-word; }
    .output { margin-top: 40px; border-top: 1px solid #bac2b7; padding-top: 24px; }
    .caption, #status { font-size: 14px; color: #526957; }
    [aria-invalid="true"] { border-color: #a53a2b; }
  </style>
</head>
<body>
  <main>
    <header><strong>serelllka</strong><span>RU → EN</span></header>
    <section>
      <label for="word">Введите слово на русском</label>
      <input id="word" type="text" autocomplete="off" placeholder="Например, солнце" aria-describedby="status">
      <div class="output">
        <p class="caption">English</p>
        <h1 id="translation" lang="ru" aria-live="polite">Перевод</h1>
        <p id="status" role="status">Загружаем словарь…</p>
        <p class="caption">Словарь <a href="https://en.openrussian.org/">OpenRussian</a> ·
          <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> ·
          <a href="DICTIONARY-LICENSE.txt">Источник и лицензия</a></p>
      </div>
    </section>
  </main>
  <script>
    (function () {
      'use strict';
      var input = document.getElementById('word');
      var output = document.getElementById('translation');
      var status = document.getElementById('status');
      var dictionary = null;
      var loadError = '';

      function update() {
        var word = input.value.trim().toLocaleLowerCase('ru').normalize('NFC');
        output.textContent = 'Перевод';
        output.lang = 'ru';
        input.setAttribute('aria-invalid', 'false');
        if (loadError) {
          status.textContent = loadError;
          return;
        }
        if (!dictionary) {
          status.textContent = 'Загружаем словарь…';
          return;
        }
        if (!word) {
          status.textContent = 'Введите слово на русском.';
          return;
        }
        if (!Object.prototype.hasOwnProperty.call(dictionary, word)) {
          status.textContent = 'Слово не найдено в словаре. Проверьте написание и начальную форму.';
          input.setAttribute('aria-invalid', 'true');
          return;
        }
        output.textContent = dictionary[word];
        output.lang = 'en';
        status.textContent = 'Перевод готов.';
      }

      function fail() {
        loadError = 'Не удалось загрузить словарь. Проверьте подключение и обновите страницу.';
        update();
      }

      input.addEventListener('input', update);
      input.addEventListener('change', update);
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'dictionary.json');
      xhr.timeout = 30000;
      xhr.onload = function () {
        if (xhr.status < 200 || xhr.status >= 300) {
          fail();
          return;
        }
        try {
          var data = JSON.parse(xhr.responseText);
          if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('Invalid dictionary');
          var keys = Object.keys(data);
          if (!keys.length || !keys.every(function (key) {
            return typeof data[key] === 'string' && data[key].trim();
          })) throw new Error('Invalid dictionary entry');
          dictionary = data;
          update();
        } catch (error) {
          fail();
        }
      };
      xhr.onerror = fail;
      xhr.ontimeout = fail;
      xhr.send();
    }());
  </script>
</body>
</html>
