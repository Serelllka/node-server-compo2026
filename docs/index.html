<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>serelllka</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #203d33; background: #f4f3ee; font: 18px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: auto; padding: 40px 24px; }
    header { display: flex; justify-content: space-between; border-bottom: 1px solid #bac2b7; padding-bottom: 20px; }
    section { padding: 70px 0; }
    label { display: block; margin-bottom: 12px; }
    input { width: 100%; padding: 18px; font: inherit; color: inherit; border: 1px solid #92a295; border-radius: 12px; background: white; }
    input:focus { outline: 3px solid #648c70; outline-offset: 3px; }
    h1 { min-height: 72px; margin: 12px 0; font-size: 48px; overflow-wrap: break-word; }
    .output { margin-top: 40px; border-top: 1px solid #bac2b7; padding-top: 24px; }
    .caption, #status, footer { font-size: 14px; color: #526957; }
    [aria-invalid="true"] { border-color: #a53a2b; }
  </style>
</head>
<body>
  <main>
    <header><strong>serelllka</strong><span>RU → EN</span></header>
    <section>
      <label for="word">Введите слово на русском</label>
      <input id="word" type="text" autocomplete="off" placeholder="Например, солнце" aria-describedby="status">
      <div class="output">
        <p class="caption">English</p>
        <h1 id="translation" lang="ru" aria-live="polite">Перевод</h1>
        <p id="status" role="status">Перевод появляется автоматически при вводе.</p>
      </div>
    </section>
    <footer>Перевод предоставлен MyMemory.</footer>
  </main>
  <script>
    (function () {
      'use strict';
      var input = document.getElementById('word');
      var output = document.getElementById('translation');
      var status = document.getElementById('status');
      var revision = 0;
      var previous = '';
      var timer;
      var request;

      function update() {
        var word = input.value.trim();
        if (word === previous) return;
        previous = word;
        var version = ++revision;
        clearTimeout(timer);
        if (request) request.abort();
        request = null;
        output.textContent = 'Перевод';
        output.lang = 'ru';
        input.setAttribute('aria-invalid', 'false');
        status.textContent = 'Перевод появляется автоматически при вводе.';
        if (!word) return;

        function fail(message) {
          if (version !== revision) return;
          status.textContent = message;
          input.setAttribute('aria-invalid', 'true');
        }

        if (new TextEncoder().encode(word).length > 500) {
          fail('Введите текст длиной до 500 байт UTF-8.');
          return;
        }
        status.textContent = 'Переводим…';
        timer = setTimeout(function () {
          var xhr = new XMLHttpRequest();
          request = xhr;
          xhr.open('GET', 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=ru%7Cen');
          xhr.timeout = 12000;
          xhr.onload = function () {
            if (version !== revision) return;
            if (xhr.status < 200 || xhr.status >= 300) {
              fail('Сервис перевода недоступен. Попробуйте позже.');
              return;
            }
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.quotaFinished) {
                fail('Лимит сервиса перевода исчерпан. Попробуйте позже.');
                return;
              }
              var translated = data && data.responseData && data.responseData.translatedText;
              var matches = data && data.matches;
              if (Array.isArray(matches)) {
                for (var i = 0; i < matches.length; i++) {
                  var entry = matches[i];
                  if (entry && entry.match === 1 && entry.segment === word && entry['created-by'] === 'Wikipedia'
                      && typeof entry.translation === 'string' && entry.translation.trim()) {
                    translated = entry.translation;
                    break;
                  }
                }
              }
              if (!data || Number(data.responseStatus) !== 200 || typeof translated !== 'string' || !translated.trim()) {
                throw new Error('Invalid translation');
              }
              output.textContent = translated.trim();
              output.lang = 'en';
              status.textContent = 'Перевод готов.';
            } catch (error) {
              fail('Не удалось получить перевод. Попробуйте позже.');
            }
          };
          xhr.onerror = function () { fail('Сервис перевода недоступен. Проверьте подключение.'); };
          xhr.ontimeout = function () { fail('Сервис перевода не ответил вовремя. Попробуйте позже.'); };
          xhr.send();
        }, 250);
      }

      input.addEventListener('input', update);
      input.addEventListener('change', update);
    }());
  </script>
</body>
</html>
